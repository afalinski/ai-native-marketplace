# AI review on every pull request (stage 3, ADR-008): the ready-made `code-review` plugin
# run by anthropics/claude-code-action@v1. Based on the "Run a skill" example in
# https://code.claude.com/docs/en/github-actions (re-read 2026-11-16).
#
# Needs, set up by the repo owner:
#   - the Claude GitHub App installed on this repository
#   - the repository secret ANTHROPIC_API_KEY (a Claude Console key with a spending limit)
#
# Claude skips draft and closed PRs, PRs it judges trivial, and PRs it has already commented on.
# GitHub withholds secrets from fork PRs, so only PRs from branches in this repo are reviewed.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review per PR at a time; a new push cancels the review of the old head.
concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Keep this line: the action starts the inline-comment MCP server only when it is named here.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
